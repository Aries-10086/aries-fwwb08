services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-party_school}
      POSTGRES_USER: ${POSTGRES_USER:-party_school}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-party_school}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-party_school} -d ${POSTGRES_DB:-party_school}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    profiles: ["ai"]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["ai"]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.4
    profiles: ["ai"]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    ports:
      - "${MILVUS_PORT:-19530}:19530"
    volumes:
      - milvus_data:/var/lib/milvus

  ai-service:
    build:
      context: ./ai-service
    profiles: ["ai"]
    environment:
      INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:-replace-with-a-long-random-secret}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL: ${LLM_MODEL:-qwen-plus}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      MILVUS_URI: http://milvus:19530
    depends_on:
      - milvus
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
