[project]
name = "party-school-ai-service"
version = "0.1.0"
description = "Internal FastAPI service for text generation, RAG indexing and chat"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "openai>=1.68",
  "pydantic-settings>=2.8",
  "pymilvus>=2.5",
  "pypdf>=5.3",
  "python-docx>=1.1",
  "sse-starlette>=2.2",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
