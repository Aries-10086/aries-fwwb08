<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>数智党校</title>
    <script>
      !(function (n) {
        function f() {
          var e = n.document.documentElement
          var w = e.clientWidth || 375
          e.style.fontSize = (w / 375) * 20 + 'px'
        }
        n.addEventListener('DOMContentLoaded', f)
        n.addEventListener('resize', f)
      })(window)
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
